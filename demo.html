<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drape.js — 3D physics demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b10;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #scene { position: fixed; inset: 0; touch-action: none; }
  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    color: #eee;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
  }
  .title small {
    display: block;
    color: #888;
    font-size: 0.72rem;
    margin-top: 2px;
    font-weight: 400;
  }
  .controls {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  button {
    background: rgba(26,26,34,0.9);
    color: #eee;
    border: 1px solid #333;
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 0.82rem;
    backdrop-filter: blur(6px);
  }
  button:active { background: #2a2a35; }
  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 0.85rem;
    z-index: 20;
    background: #0b0b10;
  }
</style>
</head>
<body>

<div id="loading" class="loading">loading scene…</div>
<div id="scene"></div>

<div class="hud">
  <div class="title">Drape.js<small>3D cloth + rigid body demo (cannon-es)</small></div>
</div>

<div class="controls">
  <button id="dropBox">📦 Drop Box</button>
  <button id="dropCloth">🧵 Drop Cloth</button>
  <button id="resetBtn">↺ Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
<script src="drape.js"></script>
<script>
(function () {
  'use strict';

  var THREE_NS = window.THREE;
  var CANNON = window.CANNON;

  // ---------- Renderer / Scene / Camera ----------
  var container = document.getElementById('scene');
  var renderer = new THREE_NS.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE_NS.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  var scene = new THREE_NS.Scene();
  scene.background = new THREE_NS.Color(0x0b0b10);
  scene.fog = new THREE_NS.Fog(0x0b0b10, 14, 30);

  // Fixed camera — no orbit controls, deliberately static viewpoint
  var camera = new THREE_NS.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 100
  );
  camera.position.set(6, 5, 9);
  camera.lookAt(0, 1, 0);

  // ---------- Lighting ----------
  var hemi = new THREE_NS.HemisphereLight(0x8899ff, 0x111116, 0.6);
  scene.add(hemi);

  var key = new THREE_NS.DirectionalLight(0xfff2e0, 1.1);
  key.position.set(5, 9, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -8;
  key.shadow.camera.right = 8;
  key.shadow.camera.top = 8;
  key.shadow.camera.bottom = -8;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 25;
  scene.add(key);

  var rim = new THREE_NS.DirectionalLight(0x6fa8ff, 0.4);
  rim.position.set(-6, 4, -6);
  scene.add(rim);

  // ---------- Ground ----------
  var groundGeo = new THREE_NS.PlaneGeometry(30, 30);
  var groundMat = new THREE_NS.MeshStandardMaterial({ color: 0x15151c, roughness: 0.95, metalness: 0.05 });
  var groundMesh = new THREE_NS.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  var grid = new THREE_NS.GridHelper(30, 30, 0x2a2a35, 0x1a1a22);
  grid.position.y = 0.01;
  scene.add(grid);

  // ---------- Physics world ----------
  var world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = true;

  var groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(groundBody);

  var defaultMaterial = new CANNON.Material('default');
  var contactMat = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
    friction: 0.4,
    restitution: 0.25
  });
  world.addContactMaterial(contactMat);
  world.defaultContactMaterial = contactMat;

  // ---------- Spinning center box (kinematic, not affected by gravity) ----------
  var centerSize = 1.4;
  var centerGeo = new THREE_NS.BoxGeometry(centerSize, centerSize, centerSize);
  var centerMat = new THREE_NS.MeshStandardMaterial({
    color: 0x6fa8ff, roughness: 0.35, metalness: 0.4, emissive: 0x0a1a33, emissiveIntensity: 0.4
  });
  var centerMesh = new THREE_NS.Mesh(centerGeo, centerMat);
  centerMesh.position.set(0, centerSize / 2 + 1.2, 0);
  centerMesh.castShadow = true;
  centerMesh.receiveShadow = true;
  scene.add(centerMesh);

  var centerBody = new CANNON.Body({
    mass: 0, // kinematic - infinite mass, we drive it manually
    shape: new CANNON.Box(new CANNON.Vec3(centerSize / 2, centerSize / 2, centerSize / 2)),
    type: CANNON.Body.KINEMATIC
  });
  centerBody.position.copy(centerMesh.position);
  world.addBody(centerBody);

  // ---------- Falling boxes (dynamic rigid bodies) ----------
  var fallingBoxes = []; // { mesh, body }
  var boxPalette = [0xff8a5c, 0x7ee8a0, 0xffd76f, 0xc792ff, 0xff6f91];

  function spawnBox() {
    var size = 0.5 + Math.random() * 0.4;
    var geo = new THREE_NS.BoxGeometry(size, size, size);
    var color = boxPalette[Math.floor(Math.random() * boxPalette.length)];
    var mat = new THREE_NS.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.2 });
    var mesh = new THREE_NS.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    var body = new CANNON.Body({
      mass: size * size * size * 4,
      shape: new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2)),
      position: new CANNON.Vec3((Math.random() - 0.5) * 4, 8 + Math.random() * 3, (Math.random() - 0.5) * 4)
    });
    body.quaternion.setFromEuler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    body.angularVelocity.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
    world.addBody(body);

    fallingBoxes.push({ mesh: mesh, body: body });

    // cap total falling boxes so the scene doesn't bloat
    if (fallingBoxes.length > 14) {
      var old = fallingBoxes.shift();
      scene.remove(old.mesh);
      world.removeBody(old.body);
    }
  }

  // ---------- Cloth, via the Drape.js library ----------
  var activeCloths = []; // DrapeMesh instances

  function spawnCloth() {
    var originX = -(14 - 1) * 0.24 / 2 + (Math.random() - 0.5) * 1.5;
    var originZ = -(14 - 1) * 0.24 / 2 + (Math.random() - 0.5) * 1.5;

    var drapeMesh = Drape.cloth({
      THREE: THREE_NS,
      cols: 14,
      rows: 14,
      spacing: 0.24,
      origin: { x: originX, y: 6 + Math.random() * 2, z: originZ },
      gravity: -0.012,
      drag: 0.985,
      iterations: 5,
      pin: false,
      color: 0xff5c7a,
      roughness: 0.75,
      metalness: 0.05
    }).withFloor(0.02);

    drapeMesh.addTo(scene);
    activeCloths.push(drapeMesh);

    if (activeCloths.length > 4) {
      var old = activeCloths.shift();
      old.removeFrom(scene);
      old.dispose();
    }
  }

  // ---------- Resize ----------
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  // ---------- Colliders for cloth (spinning box + falling boxes) ----------
  function getColliders() {
    var list = [Drape.boxCollider(centerMesh)];
    for (var i = 0; i < fallingBoxes.length; i++) {
      list.push(Drape.boxCollider(fallingBoxes[i].mesh));
    }
    return list;
  }

  // ---------- Animation loop ----------
  var clock = new THREE_NS.Clock();
  var fixedTimeStep = 1 / 60;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    // spin the kinematic center box
    centerMesh.rotation.y += dt * 0.6;
    centerMesh.rotation.x += dt * 0.25;
    centerBody.quaternion.setFromEuler(centerMesh.rotation.x, centerMesh.rotation.y, centerMesh.rotation.z);

    world.step(fixedTimeStep, dt, 3);

    for (var i = 0; i < fallingBoxes.length; i++) {
      var b = fallingBoxes[i];
      b.mesh.position.copy(b.body.position);
      b.mesh.quaternion.copy(b.body.quaternion);
    }

    var colliders = getColliders();
    var wind = { x: Math.sin(clock.elapsedTime * 0.4) * 0.004, z: Math.cos(clock.elapsedTime * 0.25) * 0.003 };

    for (var c = 0; c < activeCloths.length; c++) {
      activeCloths[c].update(colliders, wind);
    }

    renderer.render(scene, camera);
  }

  // ---------- Init ----------
  function init() {
    document.getElementById('loading').style.display = 'none';

    spawnBox();
    setTimeout(spawnBox, 400);
    setTimeout(spawnBox, 900);
    setTimeout(spawnCloth, 1400);

    animate();
  }

  document.getElementById('dropBox').onclick = spawnBox;
  document.getElementById('dropCloth').onclick = spawnCloth;
  document.getElementById('resetBtn').onclick = function () {
    fallingBoxes.forEach(function (b) { scene.remove(b.mesh); world.removeBody(b.body); });
    fallingBoxes = [];
    activeCloths.forEach(function (c) { c.removeFrom(scene); c.dispose(); });
    activeCloths = [];
    spawnBox();
    spawnCloth();
  };

  if (!THREE_NS || !CANNON || typeof Drape === 'undefined') {
    document.getElementById('loading').textContent = 'Failed to load Three.js, cannon-es, or drape.js (check network / file path).';
  } else {
    init();
  }
})();
</script>

</body>
</html>
